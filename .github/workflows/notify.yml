name: Bildirim denemesi

# Zamanlanmış bildirimler "Fiyatları güncelle" işinin sonunda gönderilir.
# Bu iş yalnızca elle deneme içindir: ayarlara bakmadan, bildirimi açık olan bütün cihazlara bir bildirim yollar.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Bildirimi gönder
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_FORCE: "1"
        run: node scripts/send-push.mjs
