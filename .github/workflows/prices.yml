name: Fiyatları güncelle

on:
  schedule:
    - cron: "7,37 * * * *"   # yarım saatte bir (GitHub yoğunken birkaç dakika gecikebilir)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: fiyatlar
  cancel-in-progress: false

jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fiyatları çek
        run: node scripts/fetch-prices.mjs
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain data/market.json)" ]; then
            git config user.name "emanet-fiyat"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/market.json
            git commit -m "Fiyatlar güncellendi"
            git push
          fi
