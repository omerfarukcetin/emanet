name: Fiyatları güncelle

on:
  schedule:
    - cron: "7,37 * * * *"   # yarım saatte bir (GitHub yoğunken birkaç dakika gecikebilir)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir
  push:                       # uygulama güncellenince de bir kez çalışır (GitHub zamanlanmış işleri sık sık geciktirir)
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: fiyatlar
  cancel-in-progress: false

jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Fiyatları çek
        run: node scripts/fetch-prices.mjs
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain data/market.json data/bench.json data/close.json)" ]; then
            git config user.name "emanet-fiyat"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/market.json data/bench.json data/close.json
            git commit -m "Fiyatlar güncellendi"
            # Bu sırada depoya başka bir gönderim yapıldıysa önce onu al, sonra gönder (3 deneme)
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              sleep 5
            done
            exit 1
          fi
      - name: Sırası gelen bildirimleri gönder
        if: ${{ !cancelled() }}
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node scripts/send-push.mjs
